name: Build and attach release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check project scripts
      - run: python -m pytest -q project/tests/
      - run: PYTHONPATH=. python scripts/export-period-results-public.py
      - run: PYTHONPATH=. python project/scenarios/generate_model_explorer.py
      - run: PYTHONPATH=. python project/scenarios/generate_simple_report.py
      - run: PYTHONPATH=. python project/scenarios/export_model_timeline.py
      - name: Attach generated outputs to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            public/data/period-results-2026.js \
            standalone/lettuce-pv-model-report.html \
            standalone/lettuce-pv-summary-report.html \
            standalone/our_simulations_timeline.html \
            standalone/our_simulations_timeline.json \
            --title "$GITHUB_REF_NAME" \
            --notes "Generated reports and public data for commit $GITHUB_SHA."
