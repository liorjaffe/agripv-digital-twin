site:
  name: "Fotovoltaica UFSC / Florianopolis"
  latitude: -27.5949
  longitude: -48.5480
  timezone: "America/Sao_Paulo"
  altitude_m: 20.0
  # Explicit scenario fallback only when the input has no air-temperature channel.
  fallback_air_temp_c: 26.0 # CROP-002; fallback scenario, not observed site temperature.

pv:
  pdc0_w: 8000.0 # PV-001; whether this is row or subsystem capacity is unresolved.
  gamma_pdc_per_c: -0.004 # PV-001 generic default, not a module datasheet value.
  # Generic PVWatts V5 default loss-factor composition, not a site measurement.
  system_losses_percent: 14.075660688264469 # PV-001.
  inverter_efficiency: 0.96 # PV-001 generic default, not an inverter datasheet value.
  height_m: 2.6 # SITE-002; not dimensioned in the retained non-scale drawing.
  pitch_m: 12.0 # SITE-002; not dimensioned in the retained non-scale drawing.
  gcr: 0.3973 # SITE-002; derived from assumed row width / pitch.
  axis_azimuth_deg: 0.0 # SITE-002; interpreted as a north-south axis, not surveyed.
  max_tilt_deg: 55.0 # SITE-002; tracker stop value, manufacturer confirmation pending.
  bifaciality: 0.7 # SITE-002; gallery-pattern assumption, module datasheet pending.
  albedo: 0.18 # SITE-002; assumed ground value, not measured at site.

crop:
  dli_target_mol_m2_day: 14.0 # DLI-001; provisional, no cultivar-specific justification.
  dli_min_mol_m2_day: 10.0 # DLI-001; scenario limit, not a site measurement.
  dli_max_mol_m2_day: 18.0 # DLI-001; scenario limit, cultivar/source follow-up pending.
  co2_ppm_target: 420.0

cultivation:
  # Site reference SITE-001; geometric bed footprint and planting grid.
  # The default net planted area assumes the full footprint is used unless a
  # more detailed planter-path or margin geometry is established later.
  bed_length_m: 7.5
  bed_width_m: 1.5
  net_planted_area_fraction: 1.0
  rows_per_bed: 24
  plants_per_row: 4

tracker:
  move_limit_deg_per_hour: 15.0
  wind_stow_speed_ms: 15.0
  # Absolute tracker rotation, not an offset; confirm the park angle with the manufacturer.
  wind_stow_tracker_theta_deg: 0.0

# Documentation-only labels from the current site scenario. These do not feed
# model calculations and do not establish physical sensor/channel placement.
descriptive_metadata:
  pv:
    system_count: 1
    modeled_subsystem: "2A-2B-2C"
    pv_over_beds: ["2A", "2C"]
    open_beds: ["2B"]
    row_width_m: 4.768 # SITE-002; not dimensioned in the retained drawing.
  crop:
    crop_type: "lettuce"
    temp_opt_c: 20.0
    temp_low_c: 10.0
    temp_high_c: 28.0
  tracker:
    control_mode: "historical"
